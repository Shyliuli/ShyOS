<body>
  <header>

      <h1>ShyOS <span class="slash">/</span> Layer DAG</h1>
      <p id="summary"></p>
    </div>
    <div id="view-controls" aria-label="画布控制">
      <button class="icon-button" id="fit" type="button" title="适应视图" aria-label="适应视图">□</button>
      <button class="icon-button" id="zoom-in" type="button" title="放大" aria-label="放大">+</button>
      <button class="icon-button" id="zoom-out" type="button" title="缩小" aria-label="缩小">−</button>
      <button class="icon-button" id="reset" type="button" title="重置选择" aria-label="重置选择">×</button>
    </div>
  </header>

  <div id="toolbar">
    <div id="layer-flow" aria-label="Layer dependency order"></div>
    <div id="legend" aria-label="图例">
      <span class="legend-item"><span class="legend-line"></span>跨层代码依赖</span>
      <span class="legend-item"><span class="legend-line loop"></span>同层依赖</span>
      <span class="legend-item"><span class="legend-line dashed"></span>能力 → 实现</span>
      <span class="legend-item"><span class="legend-card"></span>能力接口</span>
    </div>
  </div>

  <main>
    <div id="viewport">
      <svg id="dag" role="img" aria-label="ShyOS module dependency graph"></svg>
    </div>
    <div id="details" aria-live="polite">
      <span class="hint">点击图中节点，查看它的依赖闭包；依赖 / 引用标签可点击跳转。</span>
    </div>
  </main>

  <script id="dag-data" type="application/json">__SHYOS_DAG_DATA__</script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById("dag-data").textContent);
      const svg = document.getElementById("dag");
      const viewport = document.getElementById("viewport");
      const layerFlow = document.getElementById("layer-flow");
      const summary = document.getElementById("summary");
      const details = document.getElementById("details");
      const reset = document.getElementById("reset");
      const fit = document.getElementById("fit");
      const zoomIn = document.getElementById("zoom-in");
      const zoomOut = document.getElementById("zoom-out");
      const ns = "http://www.w3.org/2000/svg";

      function hexRgb(hex) {
        return [
          parseInt(hex.slice(1, 3), 16),
          parseInt(hex.slice(3, 5), 16),
          parseInt(hex.slice(5, 7), 16)
        ];
      }

      function hslRgb(hue, saturation, lightness) {
        const s = saturation / 100;
        const l = lightness / 100;
        const chroma = (1 - Math.abs(2 * l - 1)) * s;
        const part = hue / 60;
        const x = chroma * (1 - Math.abs((part % 2) - 1));
        let rgb = [0, 0, 0];
        if (part < 1) rgb = [chroma, x, 0];
        else if (part < 2) rgb = [x, chroma, 0];
        else if (part < 3) rgb = [0, chroma, x];
        else if (part < 4) rgb = [0, x, chroma];
        else if (part < 5) rgb = [x, 0, chroma];
        else rgb = [chroma, 0, x];
        const match = l - chroma / 2;
        return rgb.map((value) => Math.round((value + match) * 255));
      }

      function colorsForAccent(accent, rgb) {
        const [r, g, b] = rgb;
        return {
          accent,
          fill: `rgba(${r}, ${g}, ${b}, 0.08)`,
          stroke: `rgba(${r}, ${g}, ${b}, 0.44)`,
          track: `rgba(${r}, ${g}, ${b}, 0.035)`,
          trackStroke: `rgba(${r}, ${g}, ${b}, 0.13)`,
          glow: `rgba(${r}, ${g}, ${b}, 0.44)`
        };
      }

      const fixedAccents = ["#2dd4bf", "#fbbf24", "#60a5fa", "#c084fc"];
      const sharedColors = colorsForAccent("#94a3b8", hexRgb("#94a3b8"));
      const rankColors = new Map(data.layers.map((layer) => {
        if (layer.rank < fixedAccents.length) {
          const accent = fixedAccents[layer.rank];
          return [layer.rank, colorsForAccent(accent, hexRgb(accent))];
        }
        const hue = (18 + (layer.rank - 4) * 137.5) % 360;
        const rgb = hslRgb(hue, 72, 68);
        return [
          layer.rank,
          colorsForAccent(`hsl(${hue} 72% 68%)`, rgb)
        ];
      }));
      const layerMap = new Map(data.layers.map((layer) => [layer.key, layer]));
      const columnMap = new Map(data.columns.map((column) => [column.key, column]));
      const columnIndex = new Map(
        data.columns.map((column, index) => [column.key, index])
      );

      function colorsForGroup(group) {
        if (group === "shared") return sharedColors;
        return rankColors.get(layerMap.get(group)?.rank) || sharedColors;
      }

      const modules = data.modules.map((module) => ({
        ...module,
        group: module.layer || "shared"
      }));
      const moduleMap = new Map(modules.map((module) => [module.key, module]));
      const capabilityMap = new Map(
        modules
          .filter((module) => module.capability)
          .map((module) => [module.capability, module.key])
      );
      const users = new Map(modules.map((module) => [module.key, []]));
      modules.forEach((module) => {
        module.dependencies.forEach((dependency) => {
          users.get(dependency)?.push(module.key);
        });
      });
      users.forEach((items) => items.sort());

      summary.innerHTML =
        `<b>${data.layers.length}</b> 个编号层 · ` +
        `<b>${modules.length}</b> 个组件模块 · ` +
        `同层依赖链深度上限 <b>${data.maxIntraLayerDepth}</b>`;

      const flowLabel = document.createElement("span");
      flowLabel.className = "flow-label";
      flowLabel.textContent = "Layer DAG";
      layerFlow.append(flowLabel);
      data.layers.forEach((layer, index) => {
        if (index > 0) {
          const arrow = document.createElement("span");
          arrow.className = "flow-arrow";
          arrow.textContent = "→";
          layerFlow.append(arrow);
        }
        const item = document.createElement("span");
        const colors = rankColors.get(layer.rank);
        item.className = "flow-layer";
        item.style.setProperty("--ac", colors.accent);
        item.style.setProperty("--fill", colors.fill);
        item.style.setProperty("--stroke", colors.stroke);
        item.textContent = layer.key;
        layerFlow.append(item);
      });

      const nodeWidth = 210;
      const nodeHeight = 58;
      const dummyHeight = 10;
      const slotGap = 12;
      const columnGap = 72;
      const left = 24;
      const right = 24;
      const top = 16;
      const bottom = 18;
      const headerHeight = 54;
      const contentPad = 14;
      const sectionHeight = 24;

      function slotHeight(slot) {
        return slot.type === "module" ? nodeHeight : dummyHeight;
      }

      function columnContentHeight(column) {
        if (!column.slots.length) return 80;
        let height = column.slots.reduce(
          (total, slot) => total + slotHeight(slot),
          0
        ) + slotGap * (column.slots.length - 1);
        if (column.key === "shared") {
          const capabilityCount = column.slots.filter((slot) => {
            return slot.type === "module" &&
              moduleMap.get(slot.key)?.kind === "capability";
          }).length;
          const moduleCount = column.slots.length - capabilityCount;
          if (capabilityCount) height += sectionHeight;
          if (moduleCount) height += sectionHeight + (capabilityCount ? 8 : 0);
        }
        return height;
      }

      const maxContentHeight = Math.max(
        80,
        ...data.columns.map(columnContentHeight)
      );
      const trackHeight = headerHeight + contentPad * 2 + maxContentHeight;
      const canvasWidth =
        left + data.columns.length * nodeWidth +
        (data.columns.length - 1) * columnGap + right;
      const canvasHeight = top + trackHeight + bottom;
      svg.setAttribute("width", canvasWidth);
      svg.setAttribute("height", canvasHeight);
      svg.setAttribute("viewBox", `0 0 ${canvasWidth} ${canvasHeight}`);

      const defs = document.createElementNS(ns, "defs");
      function addMarker(id, color) {
        const marker = document.createElementNS(ns, "marker");
        marker.setAttribute("id", id);
        marker.setAttribute("viewBox", "0 0 10 10");
        marker.setAttribute("refX", "8.5");
        marker.setAttribute("refY", "5");
        marker.setAttribute("markerWidth", "6.5");
        marker.setAttribute("markerHeight", "6.5");
        marker.setAttribute("orient", "auto-start-reverse");
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
        path.setAttribute("fill", color);
        marker.append(path);
        defs.append(marker);
      }
      addMarker("arrow", "rgba(139, 152, 169, 0.58)");
      addMarker("arrow-provider", "rgba(148, 163, 184, 0.62)");
      addMarker("arrow-shared", sharedColors.accent);
      data.layers.forEach((layer) => {
        addMarker(`arrow-rank-${layer.rank}`, rankColors.get(layer.rank).accent);
      });
      svg.append(defs);

      const trackLayer = document.createElementNS(ns, "g");
      const edgeLayer = document.createElementNS(ns, "g");
      const labelLayer = document.createElementNS(ns, "g");
      const nodeLayer = document.createElementNS(ns, "g");
      svg.append(trackLayer, edgeLayer, labelLayer, nodeLayer);

      function svgText(className, text) {
        const element = document.createElementNS(ns, "text");
        element.setAttribute("class", className);
        element.textContent = text;
        return element;
      }

      const slotPositions = new Map();
      data.columns.forEach((column, index) => {
        const colors = colorsForGroup(column.key);
        const x = left + index * (nodeWidth + columnGap);

        const track = document.createElementNS(ns, "rect");
        track.setAttribute("class", "track");
        track.setAttribute("x", x - 12);
        track.setAttribute("y", top);
        track.setAttribute("width", nodeWidth + 24);
        track.setAttribute("height", trackHeight);
        track.setAttribute("rx", 8);
        track.style.setProperty("--track", colors.track);
        track.style.setProperty("--track-stroke", colors.trackStroke);
        trackLayer.append(track);

        const tick = document.createElementNS(ns, "line");
        tick.setAttribute("class", "column-tick");
        tick.setAttribute("x1", x + 2);
        tick.setAttribute("x2", x + 22);
        tick.setAttribute("y1", top + 9);
        tick.setAttribute("y2", top + 9);
        tick.style.setProperty("--ac", colors.accent);
        trackLayer.append(tick);

        const label = svgText("column-label", "");
        label.setAttribute("x", x + 30);
        label.setAttribute("y", top + 14);
        if (column.key === "shared") {
          label.textContent = "shared";
        } else {
          const num = document.createElementNS(ns, "tspan");
          num.setAttribute("class", "num");
          num.textContent = column.key.slice(0, 2);
          label.style.setProperty("--ac", colors.accent);
          label.append(num, document.createTextNode(column.key.slice(2)));
        }
        trackLayer.append(label);

        const layer = layerMap.get(column.key);
        const depth = svgText(
          "column-depth",
          column.key === "shared"
            ? "编号层外共享契约与基础模块"
            : `组件依赖链深度 ${layer.moduleDepth}/${data.maxIntraLayerDepth}`
        );
        depth.setAttribute("x", x + 2);
        depth.setAttribute("y", top + 35);
        trackLayer.append(depth);

        if (!column.slots.length) {
          const empty = svgText("empty-column", "无组件模块");
          empty.setAttribute("x", x + nodeWidth / 2);
          empty.setAttribute("y", top + headerHeight + 54);
          trackLayer.append(empty);
          return;
        }

        let y = top + headerHeight + contentPad;
        let sharedSection = "";
        column.slots.forEach((slot) => {
          if (column.key === "shared" && slot.type === "module") {
            const section = moduleMap.get(slot.key)?.kind === "capability"
              ? "capability"
              : "module";
            if (section !== sharedSection) {
              if (sharedSection) y += 8;
              const sectionLabel = svgText(
                "section-label",
                section === "capability" ? "能力接口" : "共享实现"
              );
              sectionLabel.setAttribute("x", x + 2);
              sectionLabel.setAttribute("y", y + 10);
              trackLayer.append(sectionLabel);
              const rule = document.createElementNS(ns, "line");
              rule.setAttribute("class", "section-rule");
              rule.setAttribute("x1", x + 70);
              rule.setAttribute("x2", x + nodeWidth - 2);
              rule.setAttribute("y1", y + 7);
              rule.setAttribute("y2", y + 7);
              trackLayer.append(rule);
              y += sectionHeight;
              sharedSection = section;
            }
          }
          const height = slotHeight(slot);
          slotPositions.set(slot.id, {
            x: x + nodeWidth / 2,
            y: y + height / 2,
            nodeX: x,
            nodeY: y,
            type: slot.type,
            column: column.key
          });
          y += height + slotGap;
        });
      });

      function routePoints(edge) {
        const points = edge.route.map((step) => slotPositions.get(step.slot));
        const source = points[0];
        const target = points[points.length - 1];
        const forward = columnIndex.get(target.column) >= columnIndex.get(source.column);
        return points.map((point, index) => {
          if (index === 0 && point.type === "module") {
            return {
              x: point.nodeX + (forward ? nodeWidth : 0),
              y: point.nodeY + nodeHeight / 2
            };
          }
          if (index === points.length - 1 && point.type === "module") {
            return {
              x: point.nodeX + (forward ? 0 : nodeWidth),
              y: point.nodeY + nodeHeight / 2
            };
          }
          return { x: point.x, y: point.y };
        });
      }

      function crossColumnPath(points, long) {
        if (!long && points.length === 2) {
          const middle = (points[0].x + points[1].x) / 2;
          return `M ${points[0].x} ${points[0].y} ` +
            `C ${middle} ${points[0].y}, ${middle} ${points[1].y}, ` +
            `${points[1].x} ${points[1].y}`;
        }
        let path = `M ${points[0].x} ${points[0].y}`;
        for (let index = 1; index < points.length; index += 1) {
          const previous = points[index - 1];
          const current = points[index];
          const middle = (previous.x + current.x) / 2;
          path += ` H ${middle} V ${current.y} H ${current.x}`;
        }
        return path;
      }

      function labelPosition(points) {
        const middle = (points.length - 1) / 2;
        if (Number.isInteger(middle)) return points[middle];
        const first = points[Math.floor(middle)];
        const second = points[Math.ceil(middle)];
        return {
          x: (first.x + second.x) / 2,
          y: (first.y + second.y) / 2
        };
      }

      const edgeEls = [];
      data.edges.forEach((edge) => {
        const path = document.createElementNS(ns, "path");
        const classes = ["edge", edge.kind];
        if (edge.intra) classes.push("intra");
        if (edge.long) classes.push("long");
        if (edge.selected) classes.push("selected");
        path.setAttribute("class", classes.join(" "));
        path.dataset.from = edge.from;
        path.dataset.to = edge.to;
        path.dataset.kind = edge.kind;

        let points;
        if (edge.intra) {
          const from = slotPositions.get(`module:${edge.from}`);
          const to = slotPositions.get(`module:${edge.to}`);
          const startX = from.nodeX + nodeWidth;
          const startY = from.nodeY + nodeHeight / 2;
          const endX = to.nodeX + nodeWidth - 8;
          const endY = to.nodeY + nodeHeight / 2;
          const bend = startX + 28;
          path.setAttribute(
            "d",
            `M ${startX} ${startY} C ${bend} ${startY}, ` +
            `${bend} ${endY}, ${endX} ${endY}`
          );
          points = [
            { x: startX, y: startY },
            { x: endX, y: endY }
          ];
        } else {
          points = routePoints(edge);
          path.setAttribute("d", crossColumnPath(points, edge.long));
        }
        path.setAttribute(
          "marker-end",
          edge.kind === "provider"
            ? "url(#arrow-provider)"
            : "url(#arrow)"
        );
        edgeLayer.append(path);

        let label = null;
        if (edge.kind === "provider") {
          const position = labelPosition(points);
          const width = Math.max(58, edge.define.length * 6.1 + 14);
          label = document.createElementNS(ns, "g");
          label.setAttribute(
            "class",
            `edge-label${edge.selected ? " selected" : ""}`
          );
          label.dataset.from = edge.from;
          label.dataset.to = edge.to;
          const background = document.createElementNS(ns, "rect");
          background.setAttribute("x", position.x - width / 2);
          background.setAttribute("y", position.y - 9);
          background.setAttribute("width", width);
          background.setAttribute("height", 18);
          background.setAttribute("rx", 4);
          const text = svgText("", edge.define);
          text.setAttribute("x", position.x);
          text.setAttribute("y", position.y + 0.5);
          label.append(background, text);
          labelLayer.append(label);
        }
        edgeEls.push({ ...edge, el: path, label });
      });

      const nodeEls = new Map();
      modules.forEach((module) => {
        const colors = colorsForGroup(module.group);
        const position = slotPositions.get(`module:${module.key}`);
        const group = document.createElementNS(ns, "g");
        group.setAttribute(
          "class",
          `node${module.kind === "capability" ? " capability" : ""}`
        );
        group.setAttribute(
          "transform",
          `translate(${position.nodeX} ${position.nodeY})`
        );
        group.setAttribute("tabindex", "0");
        group.setAttribute("role", "button");
        group.setAttribute("aria-label", module.key);
        group.dataset.key = module.key;
        group.style.setProperty("--ac", colors.accent);
        group.style.setProperty("--fill", colors.fill);
        group.style.setProperty("--stroke", colors.stroke);
        group.style.setProperty("--glow", colors.glow);

        const card = document.createElementNS(ns, "rect");
        card.setAttribute("class", "card");
        card.setAttribute("width", nodeWidth);
        card.setAttribute("height", nodeHeight);
        card.setAttribute("rx", 7);

        const bar = document.createElementNS(ns, "rect");
        bar.setAttribute("class", "bar");
        bar.setAttribute("y", 12);
        bar.setAttribute("width", 3);
        bar.setAttribute("height", nodeHeight - 24);
        bar.setAttribute("rx", 1.5);

        const title = svgText("node-title", module.key);
        title.setAttribute("x", 16);
        title.setAttribute("y", 25);

        const dependencyCount = module.dependencies.length;
        const userCount = users.get(module.key).length;
        const selectedProvider = module.provides.some((provider) => provider.selected);
        let metaText;
        if (module.kind === "capability") {
          metaText = `能力接口 · ${module.providers.length} 个实现`;
        } else if (module.provides.length) {
          metaText =
            `依赖 ${dependencyCount} · 提供 ${module.provides.length}` +
            (selectedProvider ? " · 当前" : "");
        } else {
          metaText = `依赖 ${dependencyCount} · 被引用 ${userCount}`;
        }
        const meta = svgText("node-meta", metaText);
        meta.setAttribute("x", 16);
        meta.setAttribute("y", 44);
        group.classList.toggle("provider-selected", selectedProvider);

        group.append(card, bar, title, meta);
        nodeLayer.append(group);
        nodeEls.set(module.key, group);
      });

      let scale = 1;
      let panX = 0;
      let panY = 0;
      let fitted = false;

      function applyView() {
        svg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      }

      function setScale(nextScale, centerX, centerY) {
        const clamped = Math.min(2.5, Math.max(0.24, nextScale));
        const contentX = (centerX - panX) / scale;
        const contentY = (centerY - panY) / scale;
        panX = centerX - contentX * clamped;
        panY = centerY - contentY * clamped;
        scale = clamped;
        applyView();
      }

      function fitView() {
        const margin = 22;
        const width = Math.max(1, viewport.clientWidth - margin * 2);
        const height = Math.max(1, viewport.clientHeight - margin * 2);
        scale = Math.min(1, width / canvasWidth, height / canvasHeight);
        panX = (viewport.clientWidth - canvasWidth * scale) / 2;
        panY = (viewport.clientHeight - canvasHeight * scale) / 2;
        applyView();
        fitted = true;
      }

      fit.addEventListener("click", fitView);
      zoomIn.addEventListener("click", () => {
        setScale(scale * 1.18, viewport.clientWidth / 2, viewport.clientHeight / 2);
      });
      zoomOut.addEventListener("click", () => {
        setScale(scale / 1.18, viewport.clientWidth / 2, viewport.clientHeight / 2);
      });
      viewport.addEventListener("wheel", (event) => {
        event.preventDefault();
        const bounds = viewport.getBoundingClientRect();
        setScale(
          scale * Math.exp(-event.deltaY * 0.0014),
          event.clientX - bounds.left,
          event.clientY - bounds.top
        );
      }, { passive: false });

      let drag = null;
      viewport.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || event.target.closest(".node")) return;
        drag = {
          pointerId: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          panX,
          panY
        };
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add("dragging");
      });
      viewport.addEventListener("pointermove", (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        panX = drag.panX + event.clientX - drag.x;
        panY = drag.panY + event.clientY - drag.y;
        applyView();
      });
      function endDrag(event) {
        if (!drag || event.pointerId !== drag.pointerId) return;
        drag = null;
        viewport.classList.remove("dragging");
      }
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);
      new ResizeObserver(() => {
        if (!fitted) {
          requestAnimationFrame(fitView);
        }
      }).observe(viewport);
      requestAnimationFrame(fitView);

      const nodeElements = Array.from(nodeEls.values());
      const hintHtml =
        '<span class="hint">点击图中节点，查看它的依赖闭包；依赖 / 引用标签可点击跳转。</span>';

      function makeChip(key, text = key, selected = false, note = "") {
        const target = moduleMap.get(key);
        const colors = colorsForGroup(target?.group || "shared");
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = selected ? "chip selected" : "chip";
        chip.style.setProperty("--ac", colors.accent);
        chip.style.setProperty("--fill", colors.fill);
        chip.style.setProperty("--stroke", colors.stroke);
        chip.append(document.createTextNode(text));
        if (note) {
          const noteEl = document.createElement("span");
          noteEl.className = "relation-note";
          noteEl.textContent = ` ${note}`;
          chip.append(noteEl);
        }
        chip.addEventListener("click", () => selectNode(key));
        return chip;
      }

      function chipRow(keys) {
        if (!keys.length) {
          const none = document.createElement("span");
          none.className = "none";
          none.textContent = "无";
          return none;
        }
        const row = document.createElement("div");
        row.className = "chip-row";
        keys.forEach((key) => row.append(makeChip(key)));
        return row;
      }

      function providerRow(providers) {
        if (!providers.length) return chipRow([]);
        const row = document.createElement("div");
        row.className = "chip-row";
        providers.forEach((provider) => {
          const status = provider.selected
            ? `${provider.define} · 当前`
            : provider.define;
          row.append(
            makeChip(provider.module, provider.module, provider.selected, status)
          );
        });
        return row;
      }

      function providesRow(provides) {
        if (!provides.length) return chipRow([]);
        const row = document.createElement("div");
        row.className = "chip-row";
        provides.forEach((provider) => {
          const capabilityModule = capabilityMap.get(provider.capability);
          if (!capabilityModule) return;
          const status = provider.selected
            ? `${provider.define} · 当前`
            : provider.define;
          row.append(
            makeChip(
              capabilityModule,
              provider.capability,
              provider.selected,
              status
            )
          );
        });
        return row;
      }

      function detailCell(label, valueNode) {
        const cell = document.createElement("div");
        const labelElement = document.createElement("span");
        labelElement.className = "detail-label";
        labelElement.textContent = label;
        const value = document.createElement("div");
        value.className = "detail-value";
        value.append(valueNode);
        cell.append(labelElement, value);
        return cell;
      }

      function clearSelection() {
        nodeElements.forEach((node) => node.classList.remove("active", "dim"));
        edgeEls.forEach((edge) => {
          edge.el.classList.remove("active", "dim");
          edge.label?.classList.remove("active", "dim");
          edge.el.setAttribute(
            "marker-end",
            edge.kind === "provider"
              ? "url(#arrow-provider)"
              : "url(#arrow)"
          );
        });
        svg.style.removeProperty("--sel");
        details.innerHTML = hintHtml;
      }

      function selectNode(key) {
        const module = moduleMap.get(key);
        if (!module) return;
        const colors = colorsForGroup(module.group);
        const dependencyClosure = new Set();

        function collectDependencies(moduleKey) {
          if (dependencyClosure.has(moduleKey)) return;
          dependencyClosure.add(moduleKey);
          const current = moduleMap.get(moduleKey);
          current?.dependencies.forEach(collectDependencies);
          current?.providers
            .filter((provider) => provider.selected)
            .forEach((provider) => collectDependencies(provider.module));
        }
        collectDependencies(key);

        const visualRelated = new Set(dependencyClosure);
        edgeEls
          .filter((edge) => {
            return edge.kind === "provider" &&
              (edge.from === key || edge.to === key);
          })
          .forEach((edge) => {
            visualRelated.add(edge.from);
            visualRelated.add(edge.to);
          });

        svg.style.setProperty("--sel", colors.accent);
        nodeElements.forEach((node) => {
          node.classList.toggle("active", node.dataset.key === key);
          node.classList.toggle("dim", !visualRelated.has(node.dataset.key));
        });
        edgeEls.forEach((edge) => {
          const active = edge.kind === "provider"
            ? edge.from === key || edge.to === key ||
              (dependencyClosure.has(edge.from) &&
                dependencyClosure.has(edge.to))
            : dependencyClosure.has(edge.from) &&
              dependencyClosure.has(edge.to);
          edge.el.classList.toggle("active", active);
          edge.el.classList.toggle("dim", !active);
          edge.label?.classList.toggle("active", active);
          edge.label?.classList.toggle("dim", !active);
          if (active) {
            const rank = layerMap.get(module.group)?.rank;
            edge.el.setAttribute(
              "marker-end",
              module.group === "shared"
                ? "url(#arrow-shared)"
                : `url(#arrow-rank-${rank})`
            );
          } else {
            edge.el.setAttribute(
              "marker-end",
              edge.kind === "provider"
                ? "url(#arrow-provider)"
                : "url(#arrow)"
            );
          }
        });

        details.innerHTML = "";
        const moduleValue = document.createElement("div");
        moduleValue.id = "detail-module";
        const name = document.createElement("span");
        name.className = "mod-name";
        name.textContent = key;
        const layerChip = document.createElement("span");
        layerChip.className = "layer-chip";
        layerChip.style.setProperty("--ac", colors.accent);
        layerChip.style.setProperty("--fill", colors.fill);
        layerChip.style.setProperty("--stroke", colors.stroke);
        layerChip.textContent = module.layer || "shared";
        moduleValue.append(name, layerChip);

        details.append(
          detailCell("模块", moduleValue),
          detailCell("直接依赖", chipRow(module.dependencies)),
          detailCell("被引用", chipRow(users.get(key) || [])),
          detailCell("能力提供者", providerRow(module.providers)),
          detailCell("提供能力", providesRow(module.provides))
        );
      }

      nodeElements.forEach((node) => {
        node.addEventListener("click", () => selectNode(node.dataset.key));
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectNode(node.dataset.key);
          }
        });
      });
      reset.addEventListener("click", clearSelection);

      const initialSelection = new URLSearchParams(window.location.search)
        .get("select");
      if (initialSelection && moduleMap.has(initialSelection)) {
        selectNode(initialSelection);
      }
    })();
  </script>
</body>
</html>
